; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino

; This board's flash chip (JEDEC 0x207018) is rejected by the stock
; bootloader's XMC check -> endless "XMC flash startup fail" reboot loop.
; Use a bootloader with that check disabled (see tools/patch_bootloader.py).
board_build.arduino.custom_bootloader = ${PROJECT_DIR}/boot/bootloader_dio_80m_noxmc.bin

; --- N16R8: 16MB quad flash + 8MB octal PSRAM ---
board_build.flash_mode = dio
board_build.arduino.memory_type = dio_opi
board_build.psram_type = opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

; NOTE: do NOT use board_build.extra_flags here - it REPLACES the board's
; own defines (ARDUINO_USB_MODE, ARDUINO_RUNNING_CORE, ...). Use build_flags.
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0   ; Serial.print goes to the USB-C port marked "COM" (set 1 for the "USB" port)
    -DCORE_DEBUG_LEVEL=3          ; show ESP-IDF errors/warnings in the monitor

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.7
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit BusIO @ ^1.14.1
    blynkkk/Blynk @ ^1.3.2
    chris--a/Keypad @ ^3.1.1
